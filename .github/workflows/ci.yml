name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check-types

      # Includes the npm wrapper test: a signal sent to bin/gambi must reach the
      # platform binary instead of orphaning it (#103). Needs Node on PATH.
      - name: CLI tests
        run: bun test packages/cli/src

      # The hub from the outside: a real hub on a random port, a real
      # participant runtime and a fake local provider. No network needed.
      - name: Core tests
        run: bun test packages/core/src

      - name: SDK tests
        run: bun test packages/sdk/src

      - name: TUI tests
        run: bun run --cwd apps/tui test

      # The Effect test helper every Effect test in the repo runs on.
      - name: Effect test helper tests
        run: bun test packages/testing/src

      # The npm publish and verify loop used by the release workflow. Also the
      # Effect foundation guards: one exact `effect` version, no platform API
      # in `@gambi/protocol`.
      - name: Release script tests
        run: bun test scripts

      # Packs gambi-sdk and type-checks it from a clean npm project, so the
      # published declarations cannot point at unpublished packages (#82).
      - name: Check gambi-sdk declarations as a consumer
        run: |
          bun run --cwd packages/sdk build
          bun run --cwd packages/sdk check:packed-types

      # Only the files this change touches: the repo predates the lint rules
      # and still carries pre-existing errors elsewhere. `ultracite check`
      # exits 0 on errors, so call Biome (same config) directly.
      - name: Lint changed files
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          git diff --name-only -z --diff-filter=ACMR "$base"...HEAD -- \
            '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' '*.json' '*.jsonc' '*.css' '*.astro' \
            > changed-files.txt
          if [ -s changed-files.txt ]; then
            xargs -0 bun x biome check --no-errors-on-unmatched --files-ignore-unknown=true < changed-files.txt
          else
            echo "No lintable files changed."
          fi

      - name: Docs translations in sync
        run: bun run --cwd apps/docs check:i18n

      # Also validates every internal link and #anchor (starlight-links-validator).
      - name: Build docs
        run: bun run --cwd apps/docs build
